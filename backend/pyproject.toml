[project]
name = "freefood-backend"
version = "0.1.0"
description = "Серверная часть Telegram Mini App «Продукты Даром»"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22,<1",
    "alembic>=1.18,<2",
    "apscheduler>=3.11,<4",
    "authx>=1.7.1,<2",
    "fastapi>=0.133,<1",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.13,<3",
    "sqlalchemy[asyncio]>=2.0.47,<3",
    "uvicorn>=0.41,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=9,<10",
    "ruff>=0.15,<1",
]
docs = [
    "python-docx>=1.2,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
